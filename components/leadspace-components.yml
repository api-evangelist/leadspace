    embeddable: false
  - name: Leadspace Sidekick
    kind: browser-extension
    url: https://www.leadspace.com/solutions/sidekick
    store: https://chromewebstore.google.com/detail/leadspace-sidekick/mpckhfjjjghgkakcpfegdhkhomcondll
    docs: https://support.leadspace.com/hc/en-us/categories/27780316704540-Leadspace-Sidekick
    version: 1.0.658
