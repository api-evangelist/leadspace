- aid: leadspace:leadspace-mcp-server
  name: Leadspace MCP
  description: >-
    Hosted remote MCP server exposing the Leadspace GTM Data Intelligence Cloud
    to AI assistants as a custom connector — account intelligence, company and
    contact lookup, verified email and phone reveal, and buying-intent signals,
    inside Claude, ChatGPT, Claude Code, Codex or any MCP-compatible client.
    Authenticated per user with OAuth 2.1 (authorization code + PKCE, dynamic
    client registration) against an Auth0 tenant. Lookups are free; reveals and
    intent are credit-metered. A different product, and a different credential,
    from the v4 gateway API.
