aid: leadspace
name: Leadspace
description: >-
  Leadspace is a B2B GTM Data Intelligence Cloud and customer data platform that
  unifies buyer data, account data, and buying signals into the Leadspace
  Universal Graph. Its API-first enrichment service resolves partial person and
  company records into full profiles carrying firmographics (SIC, NAICS,
  industry, revenue, employee counts), corporate family-tree hierarchy,
  department sizes, funding and investor history, installed-base and website
  technology signals, weekly buyer-intent models sourced from Leadspace Intent
  and Bombora, and persona and predictive fit scores. Leadspace exposes single
  and bulk enrichment, contact discovery (account expansion), and an
  intent-only refresh API over a single gateway, alongside Leadspace Studio for
  segment building and SmartForms for real-time inbound web-form enrichment. As
  of 2026 Leadspace also ships two self-serve agent-facing products that share
  one account: Leadspace Sidekick, a Chrome extension overlaying verified
  contact data and fit scoring on LinkedIn, and Leadspace MCP, a hosted remote
  Model Context Protocol server that plugs the same data graph into Claude,
  ChatGPT and any MCP-compatible client with per-user OAuth. It integrates with
  Salesforce, Marketo, Eloqua, and HubSpot. Leadspace is ISO 27001 certified and
  SOC 2 Type II audited.
