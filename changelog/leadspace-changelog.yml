  - version: April 2026
    date: '2026-05-06'
    url: https://support.leadspace.com/hc/en-us/articles/27273051039900-Leadspace-Release-Notes-April-2026
    breaking: false
    additions:
      - >-
        Studio Segment Builder updates for Universal Graph (v4) customers:
        ingest files for suppression and as a base list for contact discovery.
      - >-
        Discover People filters extended — filter by up to 5 Leadspace Standard
        Personas, by Required Contact Information (email, phone, or a
        combination), and by Job Function.
      - >-
        Use an existing Company List, an ingested file, or an existing segment
        as a data source for Discover People.
      - >-
        New Exclude filter options allow an existing segment or data source to
        be used for suppression, up to 100k records.
      - >-
        New Person Matching Confidence Level (Very Low / Low / Medium / High)
        alongside the existing Company Matching Confidence Level, for Universal
        Graph (v4) customers.
    changes:
      - Improved company matching ranking and logic.
      - >-
        Improved recognition of common words in company input data such as
        therapeutics, biotech, diagnostics, incorporation.
      - >-
        Internal Company Quality Score incorporated into match ranking,
        reflecting source reliability, data and profile completeness, and
        prioritization of larger established companies.
      - Better handling of multi-word company domains during matching.
