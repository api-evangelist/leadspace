versioning:
  scheme: uri-path
  current: v4
  note: >-
    Two version axes. The data graph is versioned as v3 (legacy) and v4
    (Leadspace Universal Graph). The HTTP paths are versioned per service and
    are not uniform: enrichment submission is unversioned
    (/enrichment/enrich/single, /enrichment/enrich/bulk) while enrichment
    polling is /v3/enrichment/results/, discovery is /v2/expansion/company with
    /v1/expansion/results/, and intent is /v1/intent/.
  versions:
