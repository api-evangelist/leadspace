      status: current
      label: Leadspace Universal Graph
      docs: https://support.leadspace.com/hc/en-us/articles/23687993264284-Leadspace-Single-Direct-API-v4-Technical-Specifications
    - version: v3
      status: legacy
      docs: https://support.leadspace.com/hc/en-us/articles/115006003389-Leadspace-Single-API-v3-Technical-Specifications
deprecation:
  policy_url: https://support.leadspace.com/hc/en-us/articles/23687993264284-Leadspace-Single-Direct-API-v4-Technical-Specifications
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    Deprecation is managed relationally rather than in-protocol. Leadspace does
    not emit RFC 8594 Sunset or Deprecation headers; the Integration Manager
    notifies the customer directly.
  credential_deprecation:
    recommended_rotation_months: 6
    hard_expiry_years: 2
    notice_period: 10 working days prior to the end of the token lifecycle
    process: >-
      Leadspace generates a replacement perpetual token and emails it, notifies
      the customer before the end of the token lifecycle, and deprecates the old
      token once the customer has migrated.
