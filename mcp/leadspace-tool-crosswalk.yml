gaps:
- Leadspace publishes no tools/list manifest, no llms.txt and no MCP tool reference page, so the agent-facing contract is discoverable only after OAuth. A public tool manifest would let a buyer evaluate the surface before signing up.
- Because the REST and MCP surfaces authenticate against different identity systems (Program ID vs Auth0 user), a customer cannot reuse one credential across both.
