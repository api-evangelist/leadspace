method: derived
source: mcp/leadspace-mcp.yml + openapi/
description: >-
  Binds the Leadspace MCP surface to the v4 REST gateway OpenAPI. Leadspace now
  runs two genuinely different API products against one data core: the v4 API
  gateway (apigw.leadspace.com, per-program bearer/OAuth password credentials,
  bulk-and-callback batch shape, sold to enterprise integration teams) and the
  Leadspace MCP server (skprod.leadspace.com/mcp/v1, per-USER OAuth via Auth0,
  single-record conversational shape, free tier). They are overlapping but
  non-identical projections, and this file records the divergence rather than
  pretending one wraps the other.
surfaces:
  openapi:
    files:
    - openapi/leadspace-authorization-api-openapi.yml
    - openapi/leadspace-enrichment-api-openapi.yml
    - openapi/leadspace-discovery-api-openapi.yml
    - openapi/leadspace-intent-api-openapi.yml
    - openapi/leadspace-results-api-openapi.yml
    host: https://apigw.leadspace.com
    gated: false
    note: Public technical specifications; the API itself requires a Leadspace-issued Program ID.
  mcp:
    url: https://skprod.leadspace.com/mcp/v1
    gated: true
    note: >-
      tools/list returns 401 with an RFC 9728 Bearer challenge. Tool names and
      inputSchemas require an authenticated Leadspace account, so every row
      below is mapped by published CAPABILITY and named tool where one exists —
      confidence is set accordingly and nothing is invented.
  graphql:
    present: false
