    re-revealing something you've already unlocked is always free."
  plans: plans/leadspace-plans-pricing.yml
guardrails:
- The MCP surface is credit-metered per reveal. Lookups are free; email reveal 1 credit, phone reveal 3 credits, buying intent 1 credit per company. Re-revealing previously unlocked data is free.
- Free Starter accounts are capped at 25 credits/day, so an agent loop that reveals contact details will exhaust a free account inside one working session.
- Tool input schemas are auth-gated. Do not assume argument shapes from the REST OpenAPI — the MCP surface and the v4 gateway API are different projections (see mcp/leadspace-tool-crosswalk.yml).
- Responses carry personal data about identified individuals (business email, direct dial, mobile). Handle under the customer's DPA and the Leadspace Texas Data Broker Notice / Do Not Sell process.
