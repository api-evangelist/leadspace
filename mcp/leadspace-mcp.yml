search_result: >-
  UPGRADE 2026-08-13. The 2026-07-19 pass correctly recorded that no MCP server
  existed. Leadspace has since shipped one: "Leadspace MCP", a hosted remote MCP
  server marketed as a custom connector for Claude (web, desktop, Code), ChatGPT
  (Developer Mode connectors, Codex) and "any MCP-compatible AI". The endpoint
  below is published verbatim in Leadspace's own setup instructions AND was
  independently confirmed by probe: it answers an RFC 9728 challenge
  (WWW-Authenticate: Bearer realm="leadspace-builders", resource_metadata=...)
  and serves OAuth protected-resource metadata naming itself as the resource.
  It is NOT a guessed path.
deployment:
  mode: remote
  endpoint: https://skprod.leadspace.com/mcp/v1
  install: null
  package: null
  auth: oauth
  verified: probed
  checked: '2026-08-13'
  note: >-
    Remote only. Leadspace ships no npx/stdio package and no local server; the
    same https endpoint is used by every client, including Claude Code
    (`claude mcp add --transport http leadspace https://skprod.leadspace.com/mcp/v1`)
    and OpenAI Codex.
server:
  name: leadspace
  display_name: Leadspace MCP
  transport: http
  url: https://skprod.leadspace.com/mcp/v1
  host: skprod.leadspace.com
  realm: leadspace-builders
  product: Leadspace GTM Data Intelligence Cloud (shares accounts with Leadspace Sidekick)
  auth:
    type: oauth
    protocol: OAuth 2.1 authorization code + PKCE (S256)
    authorization_server: https://stg-sk.us.auth0.com/
    authorization_endpoint: https://stg-sk.us.auth0.com/authorize
    token_endpoint: https://stg-sk.us.auth0.com/oauth/token
    registration_endpoint: https://stg-sk.us.auth0.com/oidc/register
    dynamic_client_registration: true
    scopes_supported:
    - openid
    - profile
    - email
    - offline_access
    bearer_methods_supported:
    - header
    protected_resource_metadata: https://skprod.leadspace.com/.well-known/oauth-protected-resource
    detail: scopes/leadspace-scopes.yml
    note: >-
      Setup instructions say to leave the OAuth client fields blank — the client
      is registered dynamically (RFC 7591) against the Auth0 tenant. Observation,
      not a judgement: the authorization server advertised by the PRODUCTION
      resource is the Auth0 tenant `stg-sk.us.auth0.com`, whose subdomain reads
      as a staging tenant.
client_setup:
  claude:
    docs: https://www.leadspace.com/solutions/leadspace-mcp/claude
    steps_verbatim:
    - Create a free Leadspace account with your work email. (Note: Sidekick users can log into MCP with their existing account.)
    - In Claude, open Settings → Connectors and choose Add custom connector.
    - Paste https://skprod.leadspace.com/mcp/v1, leave the OAuth fields blank, and click Connect.
    - Sign in with your Leadspace account, Leadspace tools now appear in Claude.
    claude_code_verbatim: claude mcp add --transport http leadspace https://skprod.leadspace.com/mcp/v1
  chatgpt:
    docs: https://www.leadspace.com/solutions/leadspace-mcp/chatgpt
    steps_verbatim:
    - Requires a ChatGPT plan that supports custom connectors and Developer Mode (Pro or higher).
    - In ChatGPT, go to Settings → Connectors and enable Developer Mode under Advanced Settings.
    - Click Create and enter Name Leadspace, URL https://skprod.leadspace.com/mcp/v1, Authentication OAuth. Leave the client fields blank.
    - Click Create, then Connect, and sign in with your Leadspace account.
    - Enable Leadspace from the + / Apps menu in a chat and start asking.
  other: >-
    "Prefer a local setup? You can also use Leadspace through OpenAI's Codex
    agent, or any MCP-compatible client, with the same endpoint and sign-in."
