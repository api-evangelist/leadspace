  correct at the time. Leadspace now serves TWO real, machine-readable
  /.well-known/ documents, both on the MCP host skprod.leadspace.com: RFC 9728
  OAuth Protected Resource Metadata (which names https://skprod.leadspace.com/mcp/v1
